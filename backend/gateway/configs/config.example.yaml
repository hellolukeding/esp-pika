server:
  http:
    network: tcp
    addr: 0.0.0.0:8080
    timeout: 30s
  grpc:
    network: tcp
    addr: 0.0.0.0:9000
    timeout: 30s
  media_dir: ./data/media

data:
  database:
    driver: sqlite3
    source: ./data/gateway.db
  nats:
    url: nats://127.0.0.1:4222
    shadow_bucket: esp_pika_shadow
  qdrant:
    addr: 127.0.0.1:6334
    collection: speaker_embeddings

discovery:
  mdns_enabled: true
  service_name: esp-pika-gateway
  service_type: _esp-gateway._tcp
  domain: local.
  port: 8080
  group_id: home-default
  tls: false

arbiter:
  window: 0.12s

voice:
  agent_grpc_addr: 127.0.0.1:9100
  voice_server_url: http://127.0.0.1:8081
  speaker_threshold: 0.6
  asr_provider: mock
  asr_endpoint: ""
  asr_model: whisper-1
  tts_provider: mock
  tts_endpoint: ""
  tts_model: tts-1
  default_tts_voice: zh_female_calm
  speech_api_key_env: OPENAI_API_KEY
