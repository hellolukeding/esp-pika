syntax = "proto3";

package esp_pika.gateway.conf;

import "google/protobuf/duration.proto";

option go_package = "esp-pika/backend/gateway/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Discovery discovery = 3;
  Arbiter arbiter = 4;
  Voice voice = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  string media_dir = 3;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message NATS {
    string url = 1;
    string shadow_bucket = 2;
  }
  message Qdrant {
    string addr = 1;
    string collection = 2;
  }
  Database database = 1;
  NATS nats = 2;
  Qdrant qdrant = 3;
}

message Discovery {
  bool mdns_enabled = 1;
  string service_name = 2;
  string service_type = 3;
  string domain = 4;
  int32 port = 5;
  string group_id = 6;
  bool tls = 7;
}

message Arbiter {
  google.protobuf.Duration window = 1;
}

message Voice {
  string agent_grpc_addr = 1;
  string voice_server_url = 2;
  float speaker_threshold = 3;
  string asr_provider = 4;
  string asr_endpoint = 5;
  string tts_provider = 6;
  string tts_endpoint = 7;
  string default_tts_voice = 8;
  string asr_model = 9;
  string tts_model = 10;
  string speech_api_key_env = 11;
}
